<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe proporsiya bilan</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
    }

    .centered-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      background-color: #f0f0f0;
    }

    .iframe-wrapper {
      position: relative;
      width: 90%;
      max-width: 1000px;
      aspect-ratio: 1000 / 700;
    }

    .iframe-wrapper iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="centered-container">
    <div class="iframe-wrapper">
      <iframe
        title="Inline Frame Example"
        src="https://jarus95.github.io/webgl/index.html">
      </iframe>
    </div>
  </div>
</body>
</html>
